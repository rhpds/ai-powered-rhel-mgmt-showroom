---
# Module 05 Solve — Goose AI Session (RHEL Lifecycle Lab)
#
# What this playbook does:
#   1. Adds the MCP node (mcp-{guid}) to the Ansible inventory
#   2. Kills any orphaned goose process from a prior module run (idempotency)
#   3. Ensures a tmux session is running on the MCP node
#   4. block-01: Starts a Goose AI session inside the tmux pane
#   5. Waits for Goose to initialise
#   6. blocks 02-04: Natural-language AI prompts — SKIP (non-deterministic LLM output)
#   7. block-05: Sends /quit to exit the Goose session cleanly
#   8. Verifies:
#      - Goose started (pgrep -x goose returned a PID after block-01)
#      - Goose exited cleanly (pgrep -x goose is empty after /quit)
#      - Lightspeed MCP extension is configured in goose config

- name: Module 05 Solve — add mcp node to inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add mcp node to inventory
      ansible.builtin.add_host:
        name: node
        ansible_host: "mcp-{{ lookup('ansible.builtin.env', 'GUID') }}"
        ansible_user: lab-user
        ansible_ssh_private_key_file: /app/.ssh/id_rsa
        ansible_ssh_common_args: "-F /app/.ssh/config"

- name: Module 05 Solve — Goose session start and quit
  hosts: node
  gather_facts: false
  vars:
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"

  tasks:

    # -------------------------------------------------------------------------
    # Idempotency guard — kill any orphaned goose process from a prior run
    # Use pgrep/pkill -x to match exact binary name only — avoids self-kill
    # when the shell command itself contains 'goose' in its argument string.
    # -------------------------------------------------------------------------
    - name: Kill any orphaned goose process before starting
      ansible.builtin.shell: |
        if pgrep -x 'goose' > /dev/null 2>&1; then
          pkill -x 'goose' 2>/dev/null || true
          sleep 2
        fi
        echo done
      register: r_kill_orphan
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Ensure a tmux session exists (idempotent)
    # -------------------------------------------------------------------------
    - name: Check if tmux session already running
      ansible.builtin.shell: tmux list-sessions 2>/dev/null | grep -q '.' && echo running || echo not-running
      register: r_tmux_check
      changed_when: false
      ignore_errors: true

    - name: Start detached tmux session if not running
      ansible.builtin.shell: tmux new-session -d -s main 2>/dev/null || true
      when: r_tmux_check.stdout | default('not-running') == 'not-running'
      ignore_errors: true

    # -------------------------------------------------------------------------
    # block-01: Start Goose AI session
    # -------------------------------------------------------------------------
    - name: "block-01: Send 'goose session' to tmux pane"
      ansible.builtin.shell: "tmux send-keys -t main:0.0 'goose session' Enter"
      ignore_errors: true

    - name: Wait for Goose to initialise (connect to MCP, load tools)
      ansible.builtin.pause:
        seconds: 10

    # -------------------------------------------------------------------------
    # Verify goose started (pgrep -x matches exact binary name after block-01)
    # -------------------------------------------------------------------------
    - name: Check goose process is running after start
      ansible.builtin.shell: pgrep -x 'goose' 2>/dev/null
      register: r_goose_pid
      changed_when: false
      ignore_errors: true

    - name: Set goose started fact
      ansible.builtin.set_fact:
        _goose_started: "{{ r_goose_pid.rc | default(1) == 0 and r_goose_pid.stdout | default('') | length > 0 }}"

    # -------------------------------------------------------------------------
    # blocks 02-04: Natural-language AI prompts — SKIP
    # block-02: "Provide a simple summary of RHEL versions 9 and older..."
    # block-03: "Build me an executive summary of our fleet risk posture..."
    # block-04: "Cross-reference our upcoming deprecations with lifecycle data..."
    # Reason: Non-deterministic LLM output; lab guide itself warns output may vary.
    # -------------------------------------------------------------------------

    # -------------------------------------------------------------------------
    # block-05: Send /quit to exit the Goose session
    # -------------------------------------------------------------------------
    - name: "block-05: Send '/quit' to exit Goose session"
      ansible.builtin.shell: "tmux send-keys -t main:0.0 '/quit' Enter"
      ignore_errors: true

    - name: Wait for Goose to exit cleanly
      ansible.builtin.pause:
        seconds: 5

    # -------------------------------------------------------------------------
    # Verify goose exited (pgrep -x should return empty after /quit)
    # Use exact-name match to avoid self-matching the pgrep command itself.
    # -------------------------------------------------------------------------
    - name: Check goose process is gone after /quit
      ansible.builtin.shell: pgrep -x 'goose' 2>/dev/null || true
      register: r_goose_gone
      changed_when: false
      ignore_errors: true

    - name: Set goose exited fact
      ansible.builtin.set_fact:
        _goose_exited: "{{ r_goose_gone.stdout | default('') | trim | length == 0 }}"

    # -------------------------------------------------------------------------
    # Verify lightspeedmcp extension is configured in goose config
    # lightspeedmcp runs as a stdio subprocess only during an active session;
    # the durable proof is its entry in the goose config file.
    # -------------------------------------------------------------------------
    - name: Find goose config file
      ansible.builtin.shell: |
        for path in /home/lab-user/.config/goose/config.yaml /home/lab-user/.goose/config.yaml; do
          if [ -f "$path" ]; then
            echo "$path"
            break
          fi
        done
      register: r_goose_config_path
      changed_when: false
      ignore_errors: true

    - name: Check lightspeedmcp configured in goose config
      ansible.builtin.shell: "grep -q 'lightspeedmcp' {{ r_goose_config_path.stdout | trim }} 2>/dev/null && echo configured || echo missing"
      register: r_lightspeed_cfg
      changed_when: false
      ignore_errors: true
      when: r_goose_config_path.stdout | trim | length > 0

    - name: Set lightspeedmcp config status fact
      ansible.builtin.set_fact:
        _lightspeed_ok: "{{ (r_lightspeed_cfg.stdout | default('missing') | trim) == 'configured' }}"

    # -------------------------------------------------------------------------
    # Report
    # -------------------------------------------------------------------------
    - name: Report solve status
      ansible.builtin.debug:
        msg: |
          Orphaned goose process cleared:  ok
          Goose started (block-01):        {{ 'ok' if _goose_started else 'NOT ok — goose did not start' }}
          Goose exited cleanly (block-05): {{ 'ok' if _goose_exited else 'NOT ok — goose process still present' }}
          Lightspeed MCP configured:       {{ 'ok' if _lightspeed_ok else 'NOT ok — lightspeedmcp entry missing from goose config' }}
          blocks 02-04 (AI prompts):       SKIPPED — non-deterministic LLM output, not automatable
