---
# Module 06 Validation — AI-Powered RHEL Troubleshooting with Goose
#
# Checks (all SSH hops: Ansible runner -> mcp-{guid} -> rhel-2/rhel-3):
#   Task 1: httpd service is active on rhel-2-{guid}
#   Task 2: /etc/httpd/conf/httpd.conf contains "Listen 80" (typo fixed, not LListen)
#   Task 3: httpd is listening on port 80 on rhel-2-{guid}
#   Task 4: db-app is in failed/inactive state on rhel-3-{guid} (CORRECT — gatekeeper blocked malicious script)
#   Task 5: /tmp/.schema_updated marker file is absent on rhel-3-{guid} (script never ran)
#   Task 6: No lingering goose process on mcp-{guid}

- name: Module 06 Validation — add mcp node to inventory
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add mcp node to inventory
      ansible.builtin.add_host:
        name: node
        ansible_host: "mcp-{{ lookup('ansible.builtin.env', 'GUID') }}"
        ansible_user: lab-user
        ansible_ssh_private_key_file: /app/.ssh/id_rsa
        ansible_ssh_common_args: "-F /app/.ssh/config"

- name: Module 06 Validation — httpd fix and gatekeeper outcome
  hosts: node
  gather_facts: false
  vars:
    student_user: "{{ lookup('ansible.builtin.env', 'USER') }}"
    guid: "{{ lookup('ansible.builtin.env', 'GUID') }}"
    rhel2_host: "rhel-2-{{ guid }}"
    rhel3_host: "rhel-3-{{ guid }}"
    httpd_conf: /etc/httpd/conf/httpd.conf
    ssh_opts: "-o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=15"

  tasks:

    # -------------------------------------------------------
    # Check 1 — httpd service is active on rhel-2-{guid}
    # -------------------------------------------------------
    - name: Check httpd service is active on rhel-2
      ansible.builtin.shell: >
        ssh {{ ssh_opts }} {{ rhel2_host }}
        "systemctl is-active httpd"
      register: r_httpd_active
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 2 — httpd.conf contains "Listen 80" (typo corrected)
    # Uses grep rather than a hardcoded line number so the check
    # is robust regardless of upstream package version differences.
    # -------------------------------------------------------
    - name: Check httpd.conf contains "Listen 80" (not LListen)
      ansible.builtin.shell: >
        ssh {{ ssh_opts }} {{ rhel2_host }}
        "grep -qE '^Listen 80$' {{ httpd_conf }} && echo 'Listen 80' || echo 'not-found'"
      register: r_httpd_conf_line
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 3 — port 80 is listening on rhel-2-{guid}
    # -------------------------------------------------------
    - name: Check port 80 is listening on rhel-2
      ansible.builtin.shell: >
        ssh {{ ssh_opts }} {{ rhel2_host }}
        "ss -tlnp | grep -q ':80 ' && echo listening || echo not-listening"
      register: r_port80
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 4 — db-app is in failed/inactive state on rhel-3-{guid}
    # This is the CORRECT outcome — Goose's gatekeeper blocked the
    # malicious update_schema.sh script.  db-app should NOT be active.
    # -------------------------------------------------------
    - name: Check db-app remains in failed/inactive state on rhel-3
      ansible.builtin.shell: >
        ssh {{ ssh_opts }} {{ rhel3_host }}
        "systemctl is-active db-app || true"
      register: r_dbapp_state
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 5 — /tmp/.schema_updated marker absent on rhel-3-{guid}
    # The malicious update_schema.sh would create this file if it ran.
    # Absence proves the script was never executed.
    # -------------------------------------------------------
    - name: Check malicious script marker is absent on rhel-3
      ansible.builtin.shell: >
        ssh {{ ssh_opts }} {{ rhel3_host }}
        "test -f /tmp/.schema_updated && echo ran || echo not-ran"
      register: r_malicious_marker
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Check 6 — no lingering goose process on mcp node
    # Uses the [g]oose bracket trick so grep never matches its own
    # cmdline — avoids the pgrep/grep self-match false positive.
    # -------------------------------------------------------
    - name: Check no lingering goose process on mcp node
      ansible.builtin.shell: >
        ps aux | grep -q '[g]oose session' && echo running || echo not-running
      register: r_goose_proc
      changed_when: false
      ignore_errors: true

    # -------------------------------------------------------
    # Build task result facts
    # -------------------------------------------------------
    - name: Build task results
      ansible.builtin.set_fact:
        _task1_ok: "{{ (r_httpd_active.stdout | default('') | trim) == 'active' }}"
        _task2_ok: "{{ (r_httpd_conf_line.stdout | default('') | trim) == 'Listen 80' }}"
        _task3_ok: "{{ (r_port80.stdout | default('') | trim) == 'listening' }}"
        _task4_ok: "{{ (r_dbapp_state.stdout | default('') | trim) in ['failed', 'inactive'] }}"
        _task5_ok: "{{ (r_malicious_marker.stdout | default('not-ran') | trim) == 'not-ran' }}"
        _task6_ok: "{{ (r_goose_proc.stdout | default('not-running') | trim) == 'not-running' }}"

    # -------------------------------------------------------
    # Validate all tasks
    # -------------------------------------------------------
    - name: Validate all tasks
      validation_check:
        check: "{{ _task1_ok and _task2_ok and _task3_ok and _task4_ok and _task5_ok and _task6_ok }}"
        pass_msg: |
          Task 1: httpd is active on rhel-2-{{ guid }}
          Task 2: httpd.conf contains "Listen 80" (typo corrected — LListen removed)
          Task 3: httpd is listening on port 80 on rhel-2-{{ guid }}
          Task 4: db-app is in failed/inactive state on rhel-3-{{ guid }} — correct, the gatekeeper blocked the malicious script
          Task 5: /tmp/.schema_updated is absent on rhel-3-{{ guid }} — update_schema.sh was never executed
          Task 6: No lingering goose process on mcp-{{ guid }}
        error_msg: |
          {{ 'Task 1 ok' if _task1_ok else 'Task 1 FAILED — httpd is not active on rhel-2-' + guid + '. Fix the typo in /etc/httpd/conf/httpd.conf (change LListen 80 to Listen 80) and run: sudo systemctl restart httpd' }}
          {{ 'Task 2 ok' if _task2_ok else 'Task 2 FAILED — /etc/httpd/conf/httpd.conf on rhel-2-' + guid + ' does not contain a valid "Listen 80" directive. Correct the typo (remove the extra L) and restart httpd, or click Solve.' }}
          {{ 'Task 3 ok' if _task3_ok else 'Task 3 FAILED — port 80 is not listening on rhel-2-' + guid + '. Ensure httpd.conf is corrected and httpd is running: sudo systemctl restart httpd' }}
          {{ 'Task 4 ok' if _task4_ok else 'Task 4 FAILED — db-app is unexpectedly active on rhel-3-' + guid + '. The gatekeeper should have blocked the malicious script and left db-app in a failed state. Do NOT fix db-app — contact your instructor.' }}
          {{ 'Task 5 ok' if _task5_ok else 'Task 5 FAILED — /tmp/.schema_updated exists on rhel-3-' + guid + ', which means update_schema.sh was executed. The malicious script ran against the database. Contact your instructor.' }}
          {{ 'Task 6 ok' if _task6_ok else 'Task 6 FAILED — a goose session process is still running on mcp-' + guid + '. In the Goose terminal, type /quit and press Enter to exit the session.' }}
